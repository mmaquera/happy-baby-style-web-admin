<!doctype html>
<html lang="es" data-theme="brand">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Baby Style - Admin Panel</title>
    <meta name="description" content="Panel de administración para Happy Baby Style - Gestión de productos, pedidos y clientes" />
    
    <!-- Happy Baby Style Colors -->
    <meta name="theme-color" content="#A285D1" />
    <meta name="msapplication-TileColor" content="#A285D1" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Basic favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <!-- Content Security Policy: NO inyectado como meta tag.
         Razón: `script-src 'self'` bloquea los scripts inline que Vite usa en dev (HMR + React Refresh),
         dejando la app en pantalla blanca durante `pnpm dev`.
         Recomendación: aplicar CSP estricto en headers HTTP del servidor/CDN (Fase 3 — DevOps),
         donde se puede diferenciar dev vs prod y usar nonces. Ver auditor frontend-security-auditor §5. -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
